spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
stockfish.path=${STOCKFISH_PATH}
claude.api.key=${CLAUDE_API_KEY}
claude.api.url=https://api.anthropic.com/v1/messages
claude.api.model=claude-sonnet-4-6
claude.api.max-tokens=1500
stockfish.depth=18
stockfish.pool-size=2
stockfish.cache-version=${STOCKFISH_CACHE_VERSION:stockfish-v2-pgn-fix}
chess-com.api.base-url=https://api.chess.com/pub
chess-com.api.user-agent=KnightLens/1.0 (https://knightlens.co)
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.chessdna=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
